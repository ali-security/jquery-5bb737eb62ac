<!DOCTYPE html>
<html lang="en">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Bundled jQuery 1.9.1 (src/sizzle/test/jquery.js): jQuery.extend( true, ... ) does not pollute Object.prototype (CVE-2019-11358)</title>
	<!-- The jQuery 1.9.1 that ships as the Sizzle test fixture -->
	<script src="../../../src/sizzle/test/jquery.js"></script>
</head>
<body>
	<script>
		function polluted( payload ) {
			var result;

			jQuery.extend( true, {}, JSON.parse( payload ) );
			result = "devMode" in {};

			// Clean up so the next check starts from a pristine Object.prototype
			delete Object.prototype.devMode;
			return result;
		}

		var merged = jQuery.extend( true, {}, { a: { b: 1 } }, { a: { c: 2 } } );

		window.parent.iframeCallback({
			version: jQuery.fn.jquery,
			polluted: polluted( "{\"__proto__\": {\"devMode\": true}}" ),
			nestedPolluted: polluted( "{\"a\": {\"__proto__\": {\"devMode\": true}}}" ),
			deepMerge: merged.a.b === 1 && merged.a.c === 2
		});
	</script>
</body>
</html>
